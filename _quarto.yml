project:
  type: book
  output-dir: _book

execute: 
  freeze: auto

website:
  favicon: FCFMLOGO.png
  reader-mode: true
  search:
    location: sidebar
    type: overlay
  comments:
    hypothesis: true

book:
  title: "EDES"
  reader-mode: true
  language: es
  date: today
  image: FCFMLOGO.png
  downloads: [pdf]
  favicon: FCFMLOGO.png
  sidebar:
    logo: LOGO.png
    style: floating
    collapse-level: 2
    border: true
    search: true
  repo-url: https://github.com/Crisperez517/Tesis.git
  page-navigation: true
  chapters:
    - index.qmd
    
    - part: "Marco Teórico"
      chapters: 
        - fundamentos_matematicos.qmd
        - fundamentos_numericos.qmd
        - fundamentos_epidemiologicos.qmd

    - part: "Modelo Matemático"
      chapters: 
        - Estudio_de_caso.qmd

    - part: "Simulación de Equipos (Haier HBC-150)"
      chapters: 
        - montecarlo.qmd
        
    - conclusiones.qmd
    - references.qmd

comments:
  hypothesis: true

bibliography: referencias.bib

number-sections: true

format:
  html:
    theme:
      light: flatly
      dark: superhero
    css: styles.css
    lang: es
    html-math-method: mathjax
    code-fold: true
    code-copy: true
    toc: true
    toc-location: right

  pdf:
    lang: es
    include-in-header:
      - packa.tex
      - text: |
          \usepackage{graphicx}
          \usepackage{float}
          \usepackage{amsmath}
    template-partials:
      - before-body.tex 
    documentclass: scrreprt
    papersize: us-letter
    titlegraphic: FCFMLOGO.png
    institution: Universidad Autónoma de Chiapas
    email: cristobal.perez70@unach.mx
    keep-tex: true
    pdf-engine: lualatex
    toc: true
    code-fold: true
    fig-align: center
    fig-cap-location: bottom